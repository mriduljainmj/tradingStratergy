<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Axiom · Trading Workspace</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#117d67" />
    <script>
      (() => {
        let choice = 'system';
        try {
          choice = localStorage.getItem('axiom_theme') || 'system';
        } catch {}
        document.documentElement.dataset.theme =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
